# Capability matrix for each data source. This is the single honest place that
# documents what is fully wired vs. interface-only in this build. The pipeline
# reads these flags and NEVER silently substitutes an unavailable source.
#
# capability flags:
#   implemented        : loader code exists and parses real payloads
#   current_data       : can fetch the latest / live data
#   historical_archive : can fetch point-in-time historical runs/records
#   requires_credentials
#   requires_grib      : needs cfgrib/eccodes/xarray (system ecCodes library)
#   optional           : pipeline runs without it

observations:
  ghcn_daily:
    implemented: true
    current_data: true
    historical_archive: true
    requires_credentials: false
    requires_grib: false
    optional: false
    notes: "Bulk GHCN-Daily .csv for USW00094728 from NCEI. Final QC values (not the contract label)."
  hourly_lcd:
    implemented: false
    current_data: false
    historical_archive: true
    optional: true
    notes: "NOAA Local Climatological Data. Interface stub; raises NotImplementedError with guidance."
  metar_isd:
    implemented: true
    current_data: true
    historical_archive: true
    optional: true
    notes: "METAR / ISD parsing for 6h & 24h max cross-checks. Live via aviationweather/NWS; archive via ISD."

nws_climate_report:
  implemented: true
  current_data: true
  historical_archive: partial
  requires_credentials: false
  optional: false
  notes: >
    Central Park NWS Daily Climate Report (product CLINYC / NYCCLINYC family).
    Live retrieval via NWS text-product API. Historical versions are archived as
    retrieved; deep back-archive relies on IEM/NWS archives and is documented as
    partial. Checked-in fixtures exercise the parser and versioning logic.

forecast_sources:
  nws_gridpoint:
    implemented: true
    current_data: true
    historical_archive: false
    requires_credentials: false
    requires_grib: false
    optional: false
    notes: "api.weather.gov gridpoint forecast (JSON). Fully implemented current-data baseline; no historical archive."
  nbm:
    implemented: true          # adapter + point extraction implemented
    current_data: true         # via NOMADS/AWS when Herbie+cfgrib present
    historical_archive: true   # via AWS Open Data (noaa-nbm-grib2-pds) when Herbie+cfgrib present
    requires_credentials: false
    requires_grib: true
    optional: false
    notes: "Preferred residual baseline. Requires cfgrib/eccodes (+Herbie). Raises documented ForecastSourceUnavailable when missing."
  hrrr:
    implemented: true
    current_data: true
    historical_archive: true
    requires_grib: true
    optional: true
    notes: "AWS Open Data noaa-hrrr-bdp-pds via Herbie. GRIB extras required."
  gfs:
    implemented: true
    current_data: true
    historical_archive: true
    requires_grib: true
    optional: true
    notes: "AWS Open Data noaa-gfs-bdp-pds via Herbie. GRIB extras required."
  gefs:
    implemented: true
    current_data: true
    historical_archive: true
    requires_grib: true
    optional: true
    notes: "AWS Open Data noaa-gefs-pds (ensemble) via Herbie. GRIB extras required."
  synthetic:
    implemented: true
    current_data: true
    historical_archive: true
    requires_grib: false
    optional: true
    notes: >
      Physically-plausible SYNTHETIC forecasts for offline demo/tests ONLY.
      Never used unless explicitly selected (--synthetic). Clearly labeled in provenance.
