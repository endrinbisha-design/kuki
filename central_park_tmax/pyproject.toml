[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "central_park_tmax"
version = "0.1.0"
description = "Station-specific MOS forecast of tomorrow's Central Park (KNYC) maximum temperature and NHIGH contract probabilities."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "central_park_tmax contributors" }]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "requests>=2.31",
  "joblib>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.0", "lightgbm>=4.0"]
grib = ["xarray>=2024.1", "cfgrib>=0.9.10", "eccodes>=1.6", "herbie-data>=2024.1", "fsspec>=2024.1", "s3fs>=2024.1"]
explain = ["shap>=0.44"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
central-park-tmax = "central_park_tmax.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
central_park_tmax = ["../configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]
